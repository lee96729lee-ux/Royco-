<!DOCTYPE html>
<html lang="zh-TW" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>YouTube 直播即時監控助手</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1f1f1f;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h2 {
      margin: 0;
      font-size: 20px;
      color: #ff3333;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #333;
      color: #aaa;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #bbb;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #121212;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #ff3333; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #cc0000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    button.stop { background-color: #444; }
    .status-card {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #141414;
      border: 1px solid #2a2a2a;
      text-align: center;
    }
    .status-title { font-size: 12px; color: #888; margin-bottom: 6px; }
    .status-value { font-size: 15px; font-weight: bold; }
    .status-value.active { color: #ff3333; }
    .status-value.success { color: #00e676; }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3333;
      margin-right: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 51, 51, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
    }
  </style>
</head>
<body translate="no" class="notranslate">

  <div class="card translate-protection">
    <div class="header">
      <h2>🔴 YT 直播自動跳轉</h2>
      <span class="badge">極速 1秒/次</span>
    </div>

    <div class="input-group">
      <label for="channelHandle">頻道 Handle / 帳號 (例: @YouTube)</label>
      <input type="text" id="channelHandle" placeholder="@channelName" autocomplete="off" translate="no">
    </div>

    <button id="startBtn" onclick="toggleMonitoring()">Start / 開始監控</button>

    <div class="status-card">
      <div class="status-title">Status / 監控狀態</div>
      <div id="statusText" class="status-value">Ready / 尚未開始</div>
    </div>
  </div>

  <script>
    let isMonitoring = false;
    let timer = null;

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio play error");
      }
    }

    function toggleMonitoring() {
      const handleInput = document.getElementById('channelHandle');
      const startBtn = document.getElementById('startBtn');
      const statusText = document.getElementById('statusText');

      let handle = handleInput.value.trim();
      if (!handle) {
        alert('請輸入頻道 Handle / 帳號！');
        return;
      }
      if (!handle.startsWith('@')) handle = '@' + handle;

      isMonitoring = !isMonitoring;

      if (isMonitoring) {
        startBtn.textContent = 'Stop / 停止監控';
        startBtn.classList.add('stop');
        handleInput.disabled = true;
        statusText.className = 'status-value active';
        statusText.innerHTML = '<span class="pulse"></span>Monitoring / 1秒頻率監控中...';

        playBeep();

        checkLiveStatus(handle);
        timer = setInterval(() => checkLiveStatus(handle), 1200);
      } else {
        startBtn.textContent = 'Start / 開始監控';
        startBtn.classList.remove('stop');
        handleInput.disabled = false;
        statusText.className = 'status-value';
        statusText.textContent = 'Stopped / 已停止';
        clearInterval(timer);
      }
    }

    async function checkLiveStatus(handle) {
      const targetUrl = `https://www.youtube.com/${handle}/live`;
      // 使用更穩定的 corsproxy.io 代理
      const corsProxy = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(corsProxy);
        const text = await response.text();
        
        // 增強型多重直播特徵匹配
        const isLive = text.includes('"isLive":true') || 
                       text.includes('"isLiveNow":true') || 
                       text.includes('{"text":"LIVE"}') || 
                       text.includes('{"text":"正在直播"}') ||
                       (text.includes('canonical') && text.includes('/watch?v='));

        if (isLive) {
          playBeep();
          document.getElementById('statusText').className = 'status-value success';
          document.getElementById('statusText').textContent = '🎉 LIVE / 正在直播！立即跳轉...';
          
          clearInterval(timer);
          
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 200);
        }
      } catch (err) {
        console.error('Check failed:', err);
      }
    }
  </script>
</body>
</html>
